<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GRT 2050 Hologram Logos</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at center,#081423,#01040a 70%);
  overflow:hidden;
  font-family:sans-serif;
}

/* ambient moving energy */
body::before{
  content:"";
  position:fixed;
  inset:-50%;
  background:
    radial-gradient(circle at 30% 30%,rgba(0,255,255,.15),transparent 60%),
    radial-gradient(circle at 70% 70%,rgba(0,150,255,.12),transparent 60%);
  animation:spin 20s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.stage{
  display:flex;
  gap:160px;
  perspective:1800px;
  z-index:1;
}

.holo{
  width:420px;
  height:300px;
  position:relative;
  transform-style:preserve-3d;
  animation:float 6s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

/* energy shadow on floor */
.holo::after{
  content:"";
  position:absolute;
  bottom:-60px;
  left:50%;
  width:70%;
  height:60px;
  transform:translateX(-50%) rotateX(90deg);
  background:radial-gradient(ellipse,rgba(0,255,255,.35),transparent 70%);
  filter:blur(18px);
}

/* main crystal panel */
.panel{
  position:absolute;
  inset:0;
  border-radius:20px;
  background:#000;
  overflow:hidden;
  box-shadow:
    0 60px 120px rgba(0,0,0,.9),
    inset 0 0 25px rgba(255,255,255,.12),
    0 0 60px rgba(0,255,255,.25);
  transform:translateZ(60px);
}

.panel img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* holographic color shift */
.tint{
  position:absolute;
  inset:0;
  mix-blend-mode:screen;
  background:
    linear-gradient(120deg,
      rgba(0,255,255,.25),
      rgba(0,0,255,.15),
      rgba(255,0,255,.25));
  opacity:.6;
}

/* moving specular light */
.light{
  position:absolute;
  inset:-50%;
  background:radial-gradient(circle,rgba(255,255,255,.6),transparent 60%);
  mix-blend-mode:overlay;
  pointer-events:none;
  opacity:.35;
  transition:transform .05s;
}
</style>
</head>

<body>

<div class="stage">

  <div class="holo" data-holo>
    <div class="panel">
      <img src="GRT-LOGO-05.png">
      <div class="tint"></div>
      <div class="light"></div>
    </div>
  </div>

  <div class="holo" data-holo>
    <div class="panel">
      <img src="GRT-LOGO-11.png">
      <div class="tint"></div>
      <div class="light"></div>
    </div>
  </div>

</div>

<script>
document.querySelectorAll("[data-holo]").forEach(holo=>{
  const light=holo.querySelector(".light");

  holo.addEventListener("mousemove",e=>{
    const r=holo.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width;
    const y=(e.clientY-r.top)/r.height;

    /* full 360 feel */
    const ry=(x-0.5)*40;
    const rx=(0.5-y)*40;

    holo.style.transform=
      `rotateX(${rx}deg) rotateY(${ry}deg) translateZ(20px)`;

    /* move light with finger */
    light.style.transform=
      `translate(${(x-0.5)*200}px,${(y-0.5)*200}px)`;
  });

  holo.addEventListener("mouseleave",()=>{
    holo.style.transform="rotateX(0) rotateY(0)";
    light.style.transform="translate(0,0)";
  });
});
</script>

</body>
</html>
