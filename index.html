<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GRT 2050 Hologram Logos</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:120px;
  background:radial-gradient(circle at center,#001018,#00040a 60%);
  font-family:sans-serif;
  overflow:hidden;
}

/* hologram card */
.holo{
  width:420px;
  height:260px;
  perspective:1200px;
}

.panel{
  width:100%;
  height:100%;
  position:relative;
  border-radius:24px;
  overflow:hidden;
  background:#000;
  box-shadow:
    0 0 40px rgba(0,255,255,0.25),
    inset 0 0 30px rgba(0,255,255,0.15);
  transform-style:preserve-3d;
  transition:transform .2s ease;
  animation:float 6s ease-in-out infinite;
}

.panel img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  filter:contrast(1.15) saturate(1.2);
}

/* neon edge */
.panel::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:24px;
  box-shadow:0 0 60px rgba(0,255,255,0.6);
  opacity:.6;
  pointer-events:none;
}

/* light sweep */
.light{
  position:absolute;
  top:-100%;
  left:-100%;
  width:300%;
  height:300%;
  background:linear-gradient(
    120deg,
    transparent 40%,
    rgba(255,255,255,0.35),
    transparent 60%
  );
  transform:rotate(25deg);
  animation:sweep 5s linear infinite;
  mix-blend-mode:screen;
}

@keyframes sweep{
  from{transform:translateX(-30%) rotate(25deg);}
  to{transform:translateX(30%) rotate(25deg);}
}

@keyframes float{
  0%,100%{transform:translateY(0px);}
  50%{transform:translateY(-14px);}
}
</style>
</head>

<body>

<div class="holo">
  <div class="panel">
    <img src="GRT-LOGO-05.png" alt="Logo 1">
    <div class="light"></div>
  </div>
</div>

<div class="holo">
  <div class="panel">
    <img src="GRT-LOGO-11.png" alt="Logo 2">
    <div class="light"></div>
  </div>
</div>

<script>
document.querySelectorAll(".holo").forEach(card=>{
  const panel = card.querySelector(".panel");

  card.addEventListener("mousemove",e=>{
    const r = card.getBoundingClientRect();
    const x = (e.clientX-r.left)/r.width - .5;
    const y = (e.clientY-r.top)/r.height - .5;

    panel.style.transform =
      `rotateY(${x*40}deg) rotateX(${-y*40}deg) scale(1.04)`;
  });

  card.addEventListener("mouseleave",()=>{
    panel.style.transform = "rotateY(0) rotateX(0) scale(1)";
  });
});
</script>

</body>
</html>
