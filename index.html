<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GRT 3D Logo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #0b1020, #020409 70%);
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  .scene {
    perspective: 1200px;
  }

  .logo-box {
    width: 420px;
    height: 420px;
    position: relative;
    transform-style: preserve-3d;
    animation: float 6s ease-in-out infinite;
    transition: transform 0.3s ease;
  }

  .logo-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 0 25px rgba(0,200,255,0.5))
            drop-shadow(0 0 60px rgba(0,100,255,0.3));
    backface-visibility: hidden;
  }

  /* front and back for fake 3D thickness */
  .front {
    position: absolute;
    transform: translateZ(25px);
  }

  .back {
    position: absolute;
    transform: rotateY(180deg) translateZ(25px);
    opacity: 0.25;
    filter: blur(2px);
  }

  /* mouse tilt */
  .scene:hover .logo-box {
    transform: rotateY(20deg) rotateX(10deg) scale(1.05);
  }

  @keyframes float {
    0%   { transform: rotateY(0deg) rotateX(0deg) translateY(0); }
    50%  { transform: rotateY(-10deg) rotateX(5deg) translateY(-10px); }
    100% { transform: rotateY(0deg) rotateX(0deg) translateY(0); }
  }
</style>
</head>

<body>
  <div class="scene">
    <div class="logo-box">
      <!-- use your real file name here -->
      <img src="GRT-LOGO-11.png" class="front" alt="GRT Logo">
      <img src="GRT-LOGO-11.png" class="back"  alt="">
    </div>
  </div>
</body>
