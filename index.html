<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GRT Crystal Energy Logos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
      radial-gradient(circle at 50% 40%, #0a1a2f, #02050c 70%);
    overflow: hidden;
    font-family: sans-serif;
  }

  /* animated energy background */
  body::before {
    content: "";
    position: fixed;
    inset: -50%;
    background:
      radial-gradient(circle, rgba(0,255,255,0.15), transparent 60%),
      radial-gradient(circle at 70% 30%, rgba(0,150,255,0.15), transparent 60%);
    animation: pulse 8s linear infinite;
  }

  @keyframes pulse {
    0%   { transform: rotate(0deg) scale(1); }
    50%  { transform: rotate(180deg) scale(1.2); }
    100% { transform: rotate(360deg) scale(1); }
  }

  .stage {
    display: flex;
    gap: 140px;
    perspective: 1400px;
    z-index: 1;
  }

  .card {
    width: 420px;
    height: 300px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.15s linear;
  }

  /* soft glow under card */
  .card::after {
    content: "";
    position: absolute;
    bottom: -40px;
    left: 50%;
    width: 70%;
    height: 40px;
    background: radial-gradient(ellipse, rgba(0,255,255,0.35), transparent 70%);
    transform: translateX(-50%) rotateX(90deg);
    filter: blur(15px);
  }

  .panel {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: rgba(0,0,0,0.65);
    box-shadow:
      0 40px 80px rgba(0,0,0,0.9),
      inset 0 0 25px rgba(255,255,255,0.08),
      0 0 40px rgba(0,255,255,0.25);
    transform: translateZ(40px);
    overflow: hidden;
  }

  .panel img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* glass highlight */
  .shine {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      120deg,
      transparent 30%,
      rgba(255,255,255,0.35),
      transparent 70%
    );
    mix-blend-mode: screen;
    transform: translateX(-120%);
    transition: transform 0.6s;
  }

  .card:hover .shine {
    transform: translateX(120%);
  }
</style>
</head>

<body>

<div class="stage">
  <!-- Logo 1 -->
  <div class="card" data-tilt>
    <div class="panel">
      <img src="GRT-LOGO-05.png" alt="Logo 1">
      <div class="shine"></div>
    </div>
  </div>

  <!-- Logo 2 -->
  <div class="card" data-tilt>
    <div class="panel">
      <img src="GRT-LOGO-11.png" alt="Logo 2">
      <div class="shine"></div>
    </div>
  </div>
</div>

<script>
  // realistic mouse tilt
  document.querySelectorAll("[data-tilt]").forEach(card => {
    card.addEventListener("mousemove", e => {
      const r = card.getBoundingClientRect();
      const x = e.clientX - r.left;
      const y = e.clientY - r.top;
      const rx = ((y / r.height) - 0.5) * -20;
      const ry = ((x / r.width) - 0.5) * 20;
      card.style.transform =
        `rotateX(${rx}deg) rotateY(${ry}deg) translateZ(10px)`;
    });

    card.addEventListener("mouseleave", () => {
      card.style.transform = "rotateX(0) rotateY(0)";
    });
  });
</script>

</body>
</html>
