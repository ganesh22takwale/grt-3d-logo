<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GRT 3D Logos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #0a0f1f, #02040a 70%);
    font-family: sans-serif;
  }

  .stage {
    display: flex;
    gap: 120px;
    perspective: 1200px;
  }

  .card {
    width: 380px;
    height: 380px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.4s ease;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: -20px;
    border-radius: 20px;
    background: radial-gradient(circle, rgba(0,255,255,0.25), transparent 60%);
    filter: blur(25px);
    transform: translateZ(-50px);
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 20px;
    background: #000;
    box-shadow:
      0 30px 60px rgba(0,0,0,0.7),
      inset 0 0 25px rgba(255,255,255,0.15),
      0 0 40px rgba(0,255,255,0.35);
    transform: translateZ(40px);
  }

  /* hover realistic 3D tilt */
  .card:hover {
    transform: rotateY(18deg) rotateX(8deg) translateZ(20px);
  }
</style>
</head>

<body>
  <div class="stage">
    <!-- first logo -->
    <div class="card">
      <img src="GRT-LOGO-05.png" alt="Logo 1">
    </div>

    <!-- second logo -->
    <div class="card">
      <img src="GRT-LOGO-11.png" alt="Logo 2">
    </div>
  </div>
</body>
</html>
