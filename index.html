<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRT 3D Hologram Logos</title>
<meta name="description" content="Futuristic interactive 3D holographic display showcasing GRT logos and GitHub logo with perspective tilt and dynamic lighting.">
<meta property="og:title" content="GRT 3D Hologram Logos">
<meta property="og:description" content="Futuristic interactive 3D holographic display showcasing GRT logos and GitHub logo with perspective tilt and dynamic lighting.">

<style>
* {
  box-sizing: border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at center,#001018,#00040a 75%);
  font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  overflow-x:hidden;
  color:#e2f1f8;
  position:relative;
}

/* cyber grid background accent */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
}

/* Header badge bar */
.top-bar {
  position: fixed;
  top: 18px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 28px;
  z-index: 100;
  pointer-events: auto;
}

.brand-tag {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(0, 24, 38, 0.7);
  border: 1px solid rgba(0, 255, 255, 0.25);
  backdrop-filter: blur(12px);
  padding: 7px 18px;
  border-radius: 9999px;
  font-size: 13px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #00f3ff;
  box-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
}

.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #00ffc4;
  box-shadow: 0 0 8px #00ffc4;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.85); }
}

.github-link {
  display: flex;
  align-items: center;
  gap: 9px;
  background: rgba(13, 17, 23, 0.8);
  border: 1px solid rgba(0, 255, 255, 0.3);
  backdrop-filter: blur(12px);
  padding: 7px 16px;
  border-radius: 9999px;
  font-size: 13px;
  color: #f0f6fc;
  text-decoration: none;
  transition: all 0.25s ease;
  box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
}

.github-link:hover {
  background: rgba(0, 255, 255, 0.15);
  border-color: #00f3ff;
  color: #00f3ff;
  transform: translateY(-2px);
  box-shadow: 0 0 25px rgba(0, 255, 255, 0.35);
}

.github-link svg {
  width: 17px;
  height: 17px;
  fill: currentColor;
}

/* stage container */
.stage {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 40px;
  padding: 80px 20px 40px;
  max-width: 1400px;
  width: 100%;
  z-index: 10;
}

/* hologram card */
.holo{
  width: 360px;
  height: 240px;
  perspective: 1200px;
  position: relative;
  cursor: grab;
}

.holo:active {
  cursor: grabbing;
}

.panel{
  width: 100%;
  height: 100%;
  position: relative;
  border-radius: 24px;
  overflow: hidden;
  background: #02070e;
  box-shadow:
    0 0 40px rgba(0,255,255,0.25),
    inset 0 0 30px rgba(0,255,255,0.15);
  transform-style: preserve-3d;
  transition: transform .2s ease;
  animation: float 6s ease-in-out infinite;
}

.holo:nth-child(2) .panel {
  animation-delay: -2s;
}

.holo:nth-child(3) .panel {
  animation-delay: -4s;
}

.panel img{
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: contrast(1.15) saturate(1.2);
}

/* neon edge */
.panel::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:24px;
  box-shadow:0 0 60px rgba(0,255,255,0.6);
  opacity:.6;
  pointer-events:none;
}

/* label overlay */
.card-label {
  position: absolute;
  bottom: 14px;
  left: 18px;
  right: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(0, 16, 24, 0.75);
  border: 1px solid rgba(0, 255, 255, 0.25);
  backdrop-filter: blur(8px);
  padding: 6px 14px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  color: #00f3ff;
  text-transform: uppercase;
  pointer-events: none;
  z-index: 5;
}

.card-label span.sub {
  font-size: 10px;
  color: rgba(255, 255, 255, 0.65);
  font-weight: 400;
}

/* light sweep */
.light{
  position:absolute;
  top:-100%;
  left:-100%;
  width:300%;
  height:300%;
  background:linear-gradient(
    120deg,
    transparent 40%,
    rgba(255,255,255,0.35),
    transparent 60%
  );
  transform:rotate(25deg);
  animation:sweep 5s linear infinite;
  mix-blend-mode:screen;
  pointer-events:none;
}

@keyframes sweep{
  from{transform:translateX(-30%) rotate(25deg);}
  to{transform:translateX(30%) rotate(25deg);}
}

@keyframes float{
  0%,100%{transform:translateY(0px);}
  50%{transform:translateY(-14px);}
}

/* Holographic particle glow beneath */
.holo::after {
  content: "";
  position: absolute;
  bottom: -30px;
  left: 15%;
  width: 70%;
  height: 25px;
  background: radial-gradient(ellipse, rgba(0, 255, 255, 0.35), transparent 70%);
  filter: blur(12px);
  border-radius: 50%;
  pointer-events: none;
  transition: opacity 0.3s;
}

.holo:hover::after {
  opacity: 1;
  filter: blur(16px);
}

/* Instructions footer */
.footer-hint {
  margin-top: 10px;
  font-size: 12px;
  color: rgba(0, 255, 255, 0.6);
  letter-spacing: 1px;
  text-transform: uppercase;
  text-align: center;
  z-index: 10;
}
</style>
</head>

<body>

<header class="top-bar">
  <div class="brand-tag">
    <div class="live-dot"></div>
    <span>GRT 2050 Hologram Showcase</span>
  </div>
  <a class="github-link" href="https://github.com/ganesh22takwale/grt-3d-logo" target="_blank" rel="noopener noreferrer">
    <svg viewBox="0 0 24 24">
      <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
    </svg>
    <span>GitHub Repo</span>
  </a>
</header>

<main class="stage">
  <!-- Card 1: Logo 05 -->
  <div class="holo">
    <div class="panel">
      <img src="GRT-LOGO-05.png" alt="GRT Hologram Logo 05">
      <div class="light"></div>
      <div class="card-label">
        <span>GRT Hologram 05</span>
        <span class="sub">PNG Asset</span>
      </div>
    </div>
  </div>

  <!-- Card 2: Logo 11 -->
  <div class="holo">
    <div class="panel">
      <img src="GRT-LOGO-11.png" alt="GRT Hologram Logo 11">
      <div class="light"></div>
      <div class="card-label">
        <span>GRT Hologram 11</span>
        <span class="sub">PNG Asset</span>
      </div>
    </div>
  </div>

  <!-- Card 3: GitHub File Logo -->
  <div class="holo">
    <div class="panel">
      <img src="github-logo.svg" alt="GitHub Vector Logo">
      <div class="light"></div>
      <div class="card-label">
        <span>GitHub Logo</span>
        <span class="sub">SVG Asset</span>
      </div>
    </div>
  </div>
</main>

<div class="footer-hint">
  Hover or move cursor over any hologram card for real-time 3D perspective tilt
</div>

<script>
document.querySelectorAll(".holo").forEach(card=>{
  const panel = card.querySelector(".panel");

  card.addEventListener("mousemove",e=>{
    const r = card.getBoundingClientRect();
    const x = (e.clientX-r.left)/r.width - .5;
    const y = (e.clientY-r.top)/r.height - .5;

    panel.style.transform =
      `rotateY(${x*40}deg) rotateX(${-y*40}deg) scale(1.04)`;
  });

  card.addEventListener("mouseleave",()=>{
    panel.style.transform = "rotateY(0) rotateX(0) scale(1)";
  });

  // Touch support for mobile devices
  card.addEventListener("touchmove", e => {
    if (e.touches.length > 0) {
      const touch = e.touches[0];
      const r = card.getBoundingClientRect();
      const x = (touch.clientX - r.left) / r.width - .5;
      const y = (touch.clientY - r.top) / r.height - .5;
      panel.style.transform =
        `rotateY(${x*35}deg) rotateX(${-y*35}deg) scale(1.04)`;
    }
  }, { passive: true });

  card.addEventListener("touchend", () => {
    panel.style.transform = "rotateY(0) rotateX(0) scale(1)";
  });
});
</script>

</body>
</html>
